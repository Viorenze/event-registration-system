name: event-system

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    ports:
      # 严格绑定 127.0.0.1，端口由环境变量指定，未设置则报错
      - "127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT must be set}:5432"
    environment:
      # 严禁弱默认值，未配置或为空时 Compose 必须显式报错终止
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set and non-empty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set and non-empty}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set and non-empty}
    volumes:
      # 官方 PostgreSQL 18+ 规范：必须挂载至 /var/lib/postgresql
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: event-system-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app/packages/db
    command: ["pnpm", "exec", "drizzle-kit", "migrate", "--config=drizzle.config.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: event-system-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      BETTER_AUTH_URL: http://localhost:3000
      TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/doc').then(r => process.exit(r.ok ? 0 : 1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: event-system-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:3001
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy

volumes:
  # 遵循项目级命名空间隔离，自动命名为 event-system_postgres_data
  postgres_data:
